<!DOCTYPE html>
<html>
<head>
    <!--헤더 영역-->
    <meta charset="utf-8">
    <title>처음 만드는 웹페이지</title>
    <style>
        /*css언어-중괄호 사용(반드시 끝에 세미콜론 찍음)*/
        h2{color:blue;}
        /*h3{color:rgb(255, 0, 0)}*/
        .menu{color:green;}
        .cafe{color:orange;}
        </style>
        
</head>

<body>
    <!--본문 영역-->
    <h2>웹 기초 기술</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>자바스크립트</li>
    </ul>
    
    <h3 class="menu">간식메뉴</h3>
    <ol>
        <li>라면</li>
        <li>김밥</li>
        <li>떡볶이</li>
    </ol>

    <h3 class="cafe">카페 이미지</h3>
    <img src="cafe.jpg" alt='카페' width='400'>

    <p>
        <!--a태그는 페이지 이동-->
        <a href="https://www.naver.com" target="_blank">네이버로 가기</a>
    </p>
</body>

</html>
